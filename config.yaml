# HapticPad — Konfiguration mit allen 8 Wheel-Modi, jeder in einem sinnvollen Profil.
#
# WheelMode: Clicky | Twist | Momentum | Free | Endstop | Friction | Snap | Magnetic
#
# Keycodes (https://keycode-visualizer.netlify.app/):
#   Modifier: 16=Shift, 17=Ctrl, 18=Alt, 91=GUI
#   Buchstaben: A-Z = 65-90 · Ziffern: 0-9 = 48-57
#   32=Leertaste, 13=Enter, 9=Tab, 27=Esc, 33/34=PageUp/Down, 36/35=Home/End
#   Pfeile: 37=L, 38=O, 39=R, 40=U · F1-F12 = 112-123
#   Media: 173=Mute, 174=Vol-, 175=Vol+, 176=Play, 177=Pause, 179=Vorspulen,
#          180=Zurückspulen, 181=Nächster Titel, 182=Voriger Titel, 183=Stop,
#          205=Play/Pause
#
# Jeder Button = Liste aus bis zu 3 Aktionen; eine Aktion = [Delay_ms, Keycode].
# Modifier-Kombi z.B. Strg+C = [[0,17],[0,67],[0,0]].
# WheelKey: Taste, die beim Drehen gehalten wird (0 = keine). Z.B. 17 für Strg+Scroll (Zoom).
#
# Wheel-Domains (optional, pro Button):
#   wheelMode: einer der 8 Modus-Namen. Macht den Button zum Domain-Umschalter,
#              seine actions werden dann ignoriert. Drücken schaltet das Rad auf
#              diesen Modus, nochmal drücken zurück zum Profil-Default.
#   wheelUp / wheelDown: optionale Aktion [Delay_ms, Keycode] je Drehrichtung.
#              Gesetzt = jeder Rasten-Tick sendet einen Tastendruck statt zu
#              scrollen. Weggelassen = normales Scrollen mit der Haptik der Domain.
#   wheelMod:  optionaler Modifier-Keycode (16=Shift, 17=Strg, 18=Alt), der
#              zusammen mit wheelUp/wheelDown gesendet wird — z.B. Shift+Pfeil
#              fuer Spotify Desktop (5s-Seek, Spotify muss fokussiert sein).

Settings:
  LED_Mode: "Solid"
  LED_Primary: [255, 0, 0]
  LED_Secondary: [0, 0, 255]
  LED_Menu: ["Halo", "Breath", "Bands", "Rainbow", "Solid", "Off"]
  Clicky_P: 0.5
  Clicky_I: 0.0
  Twist_P: 0.65
  Twist_I: 0.2
  Momentum_P: 0.3
  Momentum_I: 0.0
  # Haptic (SmartKnob style) — alle optional, Defaults gezeigt.
  Haptic_VoltageLimit: 3.0
  Haptic_DetentStrength: 2.5
  Haptic_EndstopStrength: 3.0
  Haptic_SnapPoint: 1.1
  Haptic_Range: 24
  Haptic_MagneticPositions: "0,6,12,18"
  Clicky_Detents: 40
  Clicky_Strength: 2.5
  Twist_Strength: 2.0
  Twist_Range: 60
  Friction_Strength: 1.0
  Snap_Strength: 3.0
  Snap_Detents: 20
  Snap_Point: 0.55
  Magnetic_Strength: 2.5
  Magnetic_Detents: 24

Profiles:
  # 1 — Clicky: feste Rasten, 1 Raste = 1 Scroll-Tick. Präzises Scrollen / Desktop.
  - name: "Desktop"
    WheelMode: "Clicky"
    WheelKey: 0
    buttons:
      - label: "Copy"
        actions: [[0, 17], [0, 67], [0, 0]]
      - label: "Paste"
        actions: [[0, 17], [0, 86], [0, 0]]
      - label: "Cut"
        actions: [[0, 17], [0, 88], [0, 0]]
      - label: "Undo"
        actions: [[0, 17], [0, 90], [0, 0]]
      - label: "Redo"
        actions: [[0, 17], [0, 89], [0, 0]]
      - label: "Find"
        actions: [[0, 17], [0, 70], [0, 0]]

  # 2 — Twist: Feder, kehrt zur Mitte zurück; Scrub-Tempo folgt Auslenkung. Video/Timeline.
  - name: "Timeline"
    WheelMode: "Twist"
    WheelKey: 0
    buttons:
      - label: "Play"
        actions: [[0, 32], [0, 0], [0, 0]]
      - label: "Save"
        actions: [[0, 17], [0, 83], [0, 0]]
      - label: "Undo"
        actions: [[0, 17], [0, 90], [0, 0]]
      - label: "Redo"
        actions: [[0, 17], [0, 89], [0, 0]]
      - label: "Marker"
        actions: [[0, 73], [0, 0], [0, 0]]
      - label: "Search"
        actions: [[0, 17], [0, 70], [0, 0]]

  # 3 — Momentum: Freilauf + Schwung. Lange Listen / Browser.
  - name: "Browser"
    WheelMode: "Momentum"
    WheelKey: 0
    buttons:
      - label: "New Tab"
        actions: [[0, 17], [0, 84], [0, 0]]
      - label: "Close Tab"
        actions: [[0, 17], [0, 87], [0, 0]]
      - label: "Refresh"
        actions: [[0, 17], [0, 82], [0, 0]]
      - label: "Back"
        actions: [[0, 18], [0, 37], [0, 0]]
      - label: "Forward"
        actions: [[0, 18], [0, 39], [0, 0]]
      - label: "Address"
        actions: [[0, 17], [0, 76], [0, 0]]

  # 4 — Free: Motor aus, leichtester Lauf. Nur kontinuierliches Scrollen.
  - name: "Light"
    WheelMode: "Free"
    WheelKey: 0
    buttons:
      - label: "PageUp"
        actions: [[0, 33], [0, 0], [0, 0]]
      - label: "PageDown"
        actions: [[0, 34], [0, 0], [0, 0]]
      - label: "Home"
        actions: [[0, 36], [0, 0], [0, 0]]
      - label: "End"
        actions: [[0, 35], [0, 0], [0, 0]]
      - label: "Tab"
        actions: [[0, 9], [0, 0], [0, 0]]
      - label: "Enter"
        actions: [[0, 13], [0, 0], [0, 0]]

  # 5 — Endstop: begrenzter Bereich mit harten Wänden. Diskrete Werte (Lautstärke).
  - name: "Volume"
    WheelMode: "Endstop"
    WheelKey: 0
    buttons:
      - label: "Mute"
        actions: [[0, 173], [0, 0], [0, 0]]
      - label: "Vol-"
        actions: [[0, 174], [0, 0], [0, 0]]
      - label: "Vol+"
        actions: [[0, 175], [0, 0], [0, 0]]
      - label: "Play"
        actions: [[0, 32], [0, 0], [0, 0]]
      - label: "Prev"
        actions: [[0, 18], [0, 37], [0, 0]]
      - label: "Next"
        actions: [[0, 18], [0, 39], [0, 0]]

  # 6 — Friction: konstanter Widerstand. Präzises Orbit/Pan (3D).
  - name: "3D Orbit"
    WheelMode: "Friction"
    WheelKey: 0
    buttons:
      - label: "Undo"
        actions: [[0, 17], [0, 90], [0, 0]]
      - label: "Redo"
        actions: [[0, 17], [0, 89], [0, 0]]
      - label: "Extrude"
        actions: [[0, 69], [0, 0], [0, 0]]
      - label: "Pull"
        actions: [[0, 81], [0, 0], [0, 0]]
      - label: "Line"
        actions: [[0, 76], [0, 0], [0, 0]]
      - label: "Inspect"
        actions: [[0, 73], [0, 0], [0, 0]]

  # 7 — Snap: rastet in nächste Position ein. Diskrete Werkzeugwahl.
  - name: "Tools"
    WheelMode: "Snap"
    WheelKey: 0
    buttons:
      - label: "Tool 1"
        actions: [[0, 49], [0, 0], [0, 0]]
      - label: "Tool 2"
        actions: [[0, 50], [0, 0], [0, 0]]
      - label: "Tool 3"
        actions: [[0, 51], [0, 0], [0, 0]]
      - label: "Tool 4"
        actions: [[0, 52], [0, 0], [0, 0]]
      - label: "Tool 5"
        actions: [[0, 53], [0, 0], [0, 0]]
      - label: "Tool 6"
        actions: [[0, 54], [0, 0], [0, 0]]

  # 8 — Magnetic: Rasten nur an 0/6/12/18 (von 24). Vier feste "Arbeitsbereiche".
  - name: "Workspaces"
    WheelMode: "Magnetic"
    WheelKey: 0
    buttons:
      - label: "WS 1"
        actions: [[0, 17], [0, 49], [0, 0]]
      - label: "WS 2"
        actions: [[0, 17], [0, 50], [0, 0]]
      - label: "WS 3"
        actions: [[0, 17], [0, 51], [0, 0]]
      - label: "WS 4"
        actions: [[0, 17], [0, 52], [0, 0]]
      - label: "Fullscreen"
        actions: [[0, 122], [0, 0], [0, 0]]
      - label: "Esc"
        actions: [[0, 27], [0, 0], [0, 0]]

  # 9 — Media: zeigt die Wheel-Domains. Button 1 und 2 ersetzen das Scrollen
  # durch eigene Rad-Modi, Button 3-6 sind normale Macro-Buttons.
  - name: "Media"
    WheelMode: "Clicky"
    WheelKey: 0
    buttons:
      # Endstops als Anschlag bei 0% und 100% Lautstärke.
      - label: "Volume"
        wheelMode: "Endstop"
        wheelUp: [0, 175]
        wheelDown: [0, 174]
      # Endstopps wie Anfang/Ende eines Songs, Ticks spulen vor/zurück.
      # ACHTUNG: Die Firmware erzwingt für Scan-Domains Friction-Haptik
      # (unbegrenzt, kontinuierlich) — ein konfigurierter Endstop würde Rasten
      # am Anschlag verschlucken und das Scratch-Konto asymmetrisch machen.
      # Spotify Desktop: SHIFT+Pfeil = 5s-Seek (App muss fokussiert sein),
      # feiner als die Media-Keys (10s). Pfeil rechts = 39, links = 37, Shift = 16.
      - label: "Scratch"
        wheelMode: "Friction"
        wheelUp: [0, 39]
        wheelDown: [0, 37]
        wheelMod: 16
      - label: "Play/Pause"
        actions: [[0, 205], [0, 0], [0, 0]]
      - label: "Next"
        actions: [[0, 181], [0, 0], [0, 0]]
      - label: "Prev"
        actions: [[0, 182], [0, 0], [0, 0]]
      - label: "Mute"
        actions: [[0, 173], [0, 0], [0, 0]]
